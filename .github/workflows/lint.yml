name: Lint

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}-lint
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.15.0
        # Build it with the runner's Go, so it can type-check that Go version.
        install-mode: goinstall
